# Companies to watch.
#
# Easiest: just add a name under `auto:`. On the next run the radar probes Greenhouse, Lever, Ashby
# and SmartRecruiters for that name, remembers where it found the board, and starts watching it.
# Names it can't find are re-tried weekly and listed by `validate`.
#
# If auto-discovery picks the wrong board or misses one, pin it under `pinned:`
# (the slug is the bit after the domain on their careers page, e.g. job-boards.greenhouse.io/<slug>).
#
# A company's existing openings are recorded silently the first time it's read, so adding companies
# never floods you — you only get alerted for roles posted after that.

pinned:
  # --- big tech with their own careers systems -------------------------------------------
  - {name: Amazon,    ats: amazon,    search: "software development engineer"}
  - {name: Microsoft, ats: microsoft, search: "software engineer"}     # experimental
  - {name: Google,    ats: google,    search: "software engineer"}     # experimental

  # --- Workday (host / tenant / site come from the careers URL) ---------------------------
  - {name: Salesforce, ats: workday, host: salesforce.wd12.myworkdayjobs.com, tenant: salesforce, site: External_Career_Site, search: "software engineer india"}
  - {name: NVIDIA,     ats: workday, host: nvidia.wd5.myworkdayjobs.com,      tenant: nvidia,     site: NVIDIAExternalCareerSite, search: "software engineer india"}
  - {name: Adobe,      ats: workday, host: adobe.wd5.myworkdayjobs.com,       tenant: adobe,      site: external_experienced, search: "software engineer india"}
  - {name: PayPal,     ats: workday, host: paypal.wd1.myworkdayjobs.com,      tenant: paypal,     site: jobs, search: "software engineer india"}
  - {name: Mastercard, ats: workday, host: mastercard.wd1.myworkdayjobs.com,  tenant: mastercard, site: CorporateCareers, search: "software engineer india"}
  - {name: Postman,    ats: workday, host: postman.wd108.myworkdayjobs.com,   tenant: postman,    site: careers, search: "engineer"}
  - {name: Target,     ats: workday, host: target.wd5.myworkdayjobs.com,      tenant: target,     site: targetcareers, search: "software engineer india"}

  # --- companies with their own careers systems ----------------------------------------------
  - {name: Atlassian, ats: atlassian}
  - {name: Uber,      ats: oracle, host: iaziqy.fa.ocs.oraclecloud.com, site: UberCareers, search: engineer}

  # --- boards whose name doesn't match the company name ------------------------------------
  - {name: Razorpay, ats: greenhouse, slug: razorpaysoftwareprivatelimited}
  - {name: Rippling, ats: rippling,   slug: rippling}

